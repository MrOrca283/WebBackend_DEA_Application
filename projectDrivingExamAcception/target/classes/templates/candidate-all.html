<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head"/>
<body>
<div th:replace="fragments/navbar"></div>
<main class="container">
    <hgroup>
        <h1>Все заявления кандидатов</h1>
        <p>Просмотр и поиск зарегистрированных кандидатов в водители</p>
    </hgroup>
    
    <!-- Сообщение об успехе -->
    <div th:if="${successMessage}" style="padding: 1rem; margin-bottom: 1rem; background-color: var(--pico-ins-color); border-radius: var(--pico-border-radius);">
        <p th:text="${successMessage}" style="margin: 0; color: white;"></p>
    </div>

    <form method="get" action="/candidates/all">
        <div class="grid">
            <input type="search" 
                   name="search" 
                   th:value="${search}"
                   placeholder="Поиск по паспорту"
                   aria-label="Поиск">
            <button type="submit">Найти</button>
        </div>
    </form>

    <div th:each="c : ${candidateInfos}" class="card">
        <h3 th:text="${c.fullName}"></h3>
        <p><strong>Паспортные данные:</strong> <span th:text="${c.passportSeriesAndNumber}"></span></p>
        <p><strong>Тип лицензии:</strong> <span th:text="${c.licenceType}"></span></p>
        <p>Пройдена ли теория: <span th:text="${c.theoryPassed ? 'Да' : 'Нет'}"></span></p>
        <p><strong>Контактные данные:</strong> <span th:text="${c.contact}"></span></p>
        </a>
    </div>
    
    <!-- Пагинация -->
    <nav th:if="${totalPages != null && totalPages > 1}" aria-label="Pagination">
        <ul style="display: flex; justify-content: center; list-style: none; padding: 0;">
            <li th:if="${currentPage > 0}">
                <a th:href="@{/candidates/all(page=${currentPage - 1}, size=10)}" role="button" class="outline">Назад</a>
            </li>
            <li style="margin: 0 1rem; align-self: center;">
                <span>Страница <strong th:text="${currentPage + 1}"></strong> из <strong th:text="${totalPages}"></strong></span>
            </li>
            <li th:if="${currentPage + 1 < totalPages}">
                <a th:href="@{/candidates/all(page=${currentPage + 1}, size=10)}" role="button" class="outline">Вперед</a>
            </li>
        </ul>
    </nav>
    
    <p th:if="${#lists.isEmpty(candidateInfos)}" class="text-center">
        <em>Кандидаты не найдены. Попробуйте изменить критерии поиска</em>
    </p>
</main>
<footer th:replace="fragments/footer"></footer>
</body>
</html>
